<!DOCTYPE html>
<html>
<head>
  <title>Collages</title>
  <style>
    body { margin:0; font-family:Arial; background:#f8f8f8; }
    #controls { padding:10px; background:#fff; border-bottom:1px solid #ddd; display:flex; flex-wrap:wrap; gap:5px; }
    button { padding:8px 12px; font-size:15px; cursor:pointer; border:1px solid #ccc; border-radius:4px; background:#f0f0f0; }
    button:hover { background:#e0e0e0; }
    .active { background:#007bff !important; color:white; border-color:#007bff; }
    iframe { border:none; width:100%; height:calc(100vh - 75px); }
  </style>
</head>
<body>
  <div id="controls"></div>
  <iframe id="frame"></iframe>

<script>
async function getAvailableDates() {
  const dates = [];
  const today = new Date();
  for (let i = 0; i < 180; i++) {
    let d = new Date(today);
    d.setDate(d.getDate() - i);
    let ds = d.toISOString().slice(0,10).replace(/-/g,'');
    try {
      let res = await fetch(`collage/${ds}.html`, {method:'HEAD'});
      if (res.ok) dates.push(ds);
    } catch(e){}
  }
  return dates.sort().reverse();
}

function createUI(dates) {
  const ctrl = document.getElementById('controls');
  const months = [...new Set(dates.map(d => d.slice(0,6)))];
  
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.textContent = m.slice(0,4) + '-' + m.slice(4,6);
    btn.onclick = () => showWeek(m, dates);
    ctrl.appendChild(btn);
  });

  if (dates.length) showWeek(months[0], dates);
}

function showWeek(month, dates) {
  const ctrl = document.getElementById('controls');
  // Remove only day buttons
  Array.from(ctrl.children).forEach(b => {
    if (b.textContent.length === 2) b.remove();
  });

  const monthDates = dates.filter(d => d.startsWith(month));
  monthDates.forEach(d => {
    const btn = document.createElement('button');
    btn.textContent = d.slice(6,8);
    btn.onclick = () => {
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      load(d);
    };
    ctrl.appendChild(btn);
  });

  load(monthDates[0]);
}

function load(date) {
  document.getElementById('frame').src = `collage/${date}.html`;
}

getAvailableDates().then(createUI);
</script>
</body>
</html>
