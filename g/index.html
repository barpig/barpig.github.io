<script>
async function getAvailableDates() {
  const today = new Date();
  const promises = [];
  const dates = [];

  // Check last 90 days (you can change to 120 or 180 if needed)
  for (let i = 0; i < 90; i++) {
    let d = new Date(today);
    d.setDate(d.getDate() - i);
    let ds = d.toISOString().slice(0,10).replace(/-/g,'');
    
    promises.push(
      fetch(`collage/${ds}.html`, { method: 'HEAD' })
        .then(res => {
          if (res.ok) dates.push(ds);
        })
        .catch(() => {}) // ignore missing files
    );
  }

  await Promise.all(promises);
  return dates.sort().reverse();
}

function createUI(dates) {
  const ctrl = document.getElementById('controls');
  ctrl.innerHTML = ''; // clear

  const months = [...new Set(dates.map(d => d.slice(0,6)))];

  months.forEach(m => {
    const btn = document.createElement('button');
    btn.textContent = m.slice(0,4) + '-' + m.slice(4,6);
    btn.onclick = () => showWeek(m, dates);
    ctrl.appendChild(btn);
  });

  if (dates.length) showWeek(months[0], dates);
}

function showWeek(month, dates) {
  const ctrl = document.getElementById('controls');
  
  // Remove previous day buttons
  Array.from(ctrl.children).forEach(b => {
    if (b.textContent.length === 2) b.remove();
  });

  const monthDates = dates.filter(d => d.startsWith(month));
  
  monthDates.forEach(d => {
    const btn = document.createElement('button');
    btn.textContent = d.slice(6,8);
    btn.onclick = () => {
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      load(d);
    };
    ctrl.appendChild(btn);
  });

  load(monthDates[0]);
}

function load(date) {
  document.getElementById('frame').src = `collage/${date}.html`;
}

// Add a simple loading message
document.getElementById('controls').innerHTML = '<div style="padding:12px;color:#666;">Loading available dates...</div>';

getAvailableDates().then(createUI);
</script>
