		<script type="text/javascript">
			window.tv_charts = [];
			
			// Initial defaults
			window.tv_interval = "D";
			window.tv_style = "1";
			let initialStudies = ["BB@tv-basicstudies"];

			// Load from URL first
			const urlParams = new URLSearchParams(window.location.search);
			if (urlParams.get('interval')) window.tv_interval = urlParams.get('interval');
			if (urlParams.get('style')) window.tv_style = urlParams.get('style');
			if (urlParams.get('studies')) {
				initialStudies = urlParams.get('studies').split(',').filter(s => s !== '');
			} else {
				// Fallback to localStorage if no URL parameters are present
				const savedStudies = localStorage.getItem('tv_applied_studies');
				if (savedStudies) {
					try {
						const parsed = JSON.parse(savedStudies);
						if (Array.isArray(parsed)) initialStudies = parsed;
					} catch(e) {}
				}
			}
			window.tv_applied_studies = initialStudies;
			window.ema_val = urlParams.get('ema') || localStorage.getItem('tv_ema_val') || "21";
			window.sma_val = urlParams.get('sma') || localStorage.getItem('tv_sma_val') || "200";

			window.getStudiesConfig = function() {
				return window.tv_applied_studies.map(s => {
					if (s === "MAExp@tv-basicstudies") return { id: s, inputs: { length: parseInt(window.ema_val) } };
					if (s === "MASimple@tv-basicstudies") return { id: s, inputs: { length: parseInt(window.sma_val) } };
					return s;
				});
			}

			window.updateURLParams = function() {
				let params = new URLSearchParams(window.location.search);
				params.set('interval', window.tv_interval);
				params.set('style', window.tv_style);
				params.set('studies', window.tv_applied_studies.join(','));
				params.set('ema', window.ema_val);
				params.set('sma', window.sma_val);
				window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}${window.location.hash}`);
			}

			window.tv_refresh = function() {
				// Re-initialize all charts with new settings from URL/LocalStorage
				window.location.reload();
			}
			
			window.setInterval = function(val) {
				window.updateActiveState(window.tv_interval, val, 'interval');
				window.tv_interval = val;
				window.updateURLParams();
				window.tv_refresh();
			}
			
			window.setStyle = function(val) {
				window.updateActiveState(window.tv_style, val, 'style');
				window.tv_style = val;
				window.updateURLParams();
				window.tv_refresh();	
			}
			
			window.updateActiveState = function(oldState, newState, type) {	
				if( oldState != null ) {
					document.getElementById("is-" + type + "-" + oldState).classList.remove('active');
				}
				document.getElementById("is-" + type + "-" + newState).classList.add('active');
			}
			
			window.tv_saveAndRefresh = function() {
				window.ema_val = document.getElementById('ema-val').value;
				window.sma_val = document.getElementById('sma-val').value;
				localStorage.setItem('tv_ema_val', window.ema_val);
				localStorage.setItem('tv_sma_val', window.sma_val);
				localStorage.setItem('tv_applied_studies', JSON.stringify(window.tv_applied_studies));
				window.updateURLParams();
				window.tv_refresh();
				window.updateIndicatorUI();
			}

			window.toggleIndicator = function(study) {
				const index = window.tv_applied_studies.indexOf(study);
				if (index > -1) {
					window.tv_applied_studies.splice(index, 1);
				} else {
					window.tv_applied_studies.push(study);
				}
				window.tv_saveAndRefresh();
			}

			window.clearIndicators = function() {
				window.tv_applied_studies = [];
				window.tv_saveAndRefresh();
			}

			window.init = function() {
				if (document.getElementById('ema-val')) document.getElementById('ema-val').value = window.ema_val;
				if (document.getElementById('sma-val')) document.getElementById('sma-val').value = window.sma_val;
				// Initialize indicators from existing chart state
				window.updateIndicatorUI();
				window.updateActiveState(null, window.tv_interval, 'interval');
				window.updateActiveState(null, window.tv_style, 'style');
			}
			
			
			
			
/* Charts */
function myFunction() {
  document.getElementById("myDropdown").classList.toggle("show");
}

function toggleLayouts() {
  document.getElementById("layoutDropdown").classList.toggle("show");
}

window.onclick = function(event) {
  if (!event.target.closest('.dropdown')) {
    var dropdowns = document.getElementsByClassName("dropdown-content");
    for (var i = 0; i < dropdowns.length; i++) {
      var openDropdown = dropdowns[i];
      if (openDropdown.classList.contains('show')) openDropdown.classList.remove('show');
    }
  }
}

window.updateIndicatorUI = function() {
    // Update ticker labels
    for (let i = 1; i <= 12; i++) {
        const label = document.getElementById('label-' + i);
        if (label) {
            const ticker = getParameter(i.toString());
            if (ticker) {
                // Extract ticker, default to '---' if not found
                const symbolOnly = ticker.includes(':') ? ticker.split(':').pop() : ticker;
                label.innerText = symbolOnly || '---';
                label.style.display = 'block';
            } else {
                label.style.display = 'none';
            }
        }
    }

    const rows = document.querySelectorAll('#myDropdown .indicator-row');
    rows.forEach(row => {
        const link = row.querySelector('a');
        const study = link.getAttribute('data-study');
        const isActive = window.tv_applied_studies.includes(study);

        if (isActive) {
            link.classList.add('indicator-active');
        } else {
            link.classList.remove('indicator-active');
        }
    });
}

/* Charts */
.dropbtn {
  background-color: #41848F;
  color: #EEE9D1;
  padding: 2px 15px;
  font-size: 12px;
  border: none;
  cursor: pointer;}

.dropbtn:hover, .dropbtn:focus {
  background-color: #97C0B7;}

.dropdown {
  position: relative;
  display: inline-block;}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #41848F;
  min-width: 300px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;}

.dropdown-content .indicator-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
}

.dropdown-content a {
  color: #EEE9D1;
  padding: 8px 0;
  flex-grow: 1;
  text-decoration: none;
  display: block;}
  
.dropdown-content .indicator-row:hover {background-color: #97C0B7}
.show {display:block;}

.indicator-active {
	background-color: #4b9ba8 !important;
	border-left: 4px solid #EEE9D1;
	padding-left: 12px !important;
	color: #fff !important;
}
.color-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding-left: 10px;
    justify-content: flex-end;
}
.color-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2);
    transition: transform 0.1s;
}
.color-dot:hover { transform: scale(1.2); border-color: #fff; }
.color-dot.selected { border: 2px solid #fff; box-shadow: 0 0 5px #fff; }

.chart-label {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 999;
    color: #FFF;
    background: rgba(0, 0, 0, 0.8);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: bold;
    pointer-events: none;
    border: 1px solid #41848F;
}

.indicator-input {
	width: 50px;
	background: #0A1C28;
	border: 1px solid #41848F;
	color: #EEE9D1;
	padding: 1px 4px;
	font-size: 11px;
	margin-left: 8px;
}
