<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>PoE 2 Skill Tree</title>  <style>    body { margin:0; font-family: Arial, sans-serif; background: #111; color: #ddd; }    #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #0a0a0a; }    canvas { display: block; }    #controls {      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8);      padding: 10px; border-radius: 8px; z-index: 100;    }    button, input { margin: 5px; padding: 8px; }  </style></head><body>  <div id="controls">    <h2>PoE 2 Passive Skill Tree</h2>    <button onclick="resetView()">Reset View</button>    <button onclick="loadTree()">Reload Data</button>    <br>    <input type="text" id="search" placeholder="Search nodes..." onkeyup="searchNodes()">  </div>  <div id="container"></div>  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>  <script>    let stage, layer, data;    async function loadTree() {      try {        const res = await fetch('https://raw.githubusercontent.com/grindinggear/poe2-skilltree-export/main/data.json');        data = await res.json();        console.log("Data loaded!", data);        renderBasicTree();      } catch(e) {        alert("Failed to load data. Make sure you're on GitHub Pages or use a local server.");        console.error(e);      }    }    function renderBasicTree() {      const container = document.getElementById('container');      container.innerHTML = '';      stage = new Konva.Stage({        container: 'container',        width: window.innerWidth,        height: window.innerHeight      });      layer = new Konva.Layer();      stage.add(layer);      // Simple node rendering (we'll improve this)      Object.values(data.nodes || {}).forEach(node => {        if (!node.x || !node.y) return;        const circle = new Konva.Circle({          x: node.x * 0.8 + stage.width()/2,   // rough centering          y: node.y * 0.8 + stage.height()/2,          radius: node.isKeystone ? 12 : node.isNotable ? 9 : 6,          fill: node.isKeystone ? '#ff0' : node.isNotable ? '#0f0' : '#aaa',          stroke: '#fff',          strokeWidth: 2        });        circle.on('click', () => {          alert(`Node: ${node.name || node.id}\nStats: ${node.stats ? node.stats.join('\n') : 'No stats'}`);        });        layer.add(circle);      });      layer.draw();      alert("Basic tree loaded! Zoom with mouse wheel, drag to pan.");    }    function resetView() {      if (stage) stage.scale({x:1, y:1});      if (layer) layer.draw();    }    function searchNodes() {      // TODO: simple search later      console.log("Search:", document.getElementById('search').value);    }    // Auto load    window.onload = loadTree;    // Make it pannable/zoomable (basic)    window.addEventListener('resize', () => {      if (stage) {        stage.width(window.innerWidth);        stage.height(window.innerHeight);      }    });  </script></body></html>
