<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>PoE 2 Skill Tree - Lightweight</title>  <style>    body { margin:0; padding:0; overflow:hidden; background:#0a0a0a; color:#ddd; font-family:Arial, sans-serif; }    #controls {      position: absolute; top: 10px; left: 10px; z-index: 100;      background: rgba(20,20,20,0.9); padding: 10px; border-radius: 8px;    }    button, input { margin: 5px; padding: 8px 12px; }    canvas { display: block; }    #info {      position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8);      padding: 12px; border-radius: 6px; max-width: 320px; display: none; z-index: 100;    }  </style></head><body>  <div id="controls">    <h2>PoE 2 Skill Tree</h2>    <button onclick="resetView()">Reset View</button>    <button onclick="loadData()">Reload Data</button>    <br>    <input type="text" id="search" placeholder="Search node name..." style="width:200px" onkeyup="if(event.key==='Enter') searchNodes()">  </div>  <div id="info"></div>  <canvas id="canvas"></canvas>  <script>    const canvas = document.getElementById('canvas');    const ctx = canvas.getContext('2d');    let data = null;    let nodes = [];    let cameraX = 0, cameraY = 0, zoom = 0.8;    let isDragging = false;    let lastMouseX, lastMouseY;    let hoveredNode = null;    async function loadData() {      try {        const res = await fetch('data.json');        data = await res.json();        nodes = Object.values(data.nodes || {});        console.log(`? Loaded ${nodes.length} nodes`);        resizeCanvas();        draw();      } catch(e) {        alert("data.json not found! Make sure it's in the same folder.");      }    }    function resizeCanvas() {      canvas.width = window.innerWidth;      canvas.height = window.innerHeight;    }    function draw() {      ctx.clearRect(0, 0, canvas.width, canvas.height);      ctx.save();      ctx.translate(canvas.width/2 + cameraX, canvas.height/2 + cameraY);      ctx.scale(zoom, zoom);      nodes.forEach(node => {        if (!node.x || !node.y) return;        const x = node.x * 0.85;        const y = node.y * 0.85;        // Simple color        let color = '#777777';        if (node.isKeystone) color = '#ffeb3b';        else if (node.isNotable) color = '#4caf50';        else if (node.isMastery) color = '#2196f3';        ctx.beginPath();        ctx.arc(x, y, node.isKeystone ? 11 : node.isNotable ? 8 : 5.5, 0, Math.PI * 2);        ctx.fillStyle = color;        ctx.strokeStyle = '#ffffff';        ctx.lineWidth = 1.5 / zoom;        ctx.fill();        ctx.stroke();      });      ctx.restore();    }    function getNodeAtMouse(mx, my) {      const worldX = (mx - canvas.width/2 - cameraX) / zoom;      const worldY = (my - canvas.height/2 - cameraY) / zoom;      for (let node of nodes) {        if (!node.x || !node.y) continue;        const dx = node.x * 0.85 - worldX;        const dy = node.y * 0.85 - worldY;        const dist = Math.sqrt(dx*dx + dy*dy);        if (dist < 20) return node;      }      return null;    }    // Mouse controls    canvas.addEventListener('mousedown', e => {      isDragging = true;      lastMouseX = e.offsetX;      lastMouseY = e.offsetY;    });    canvas.addEventListener('mousemove', e => {      if (isDragging) {        cameraX += e.offsetX - lastMouseX;        cameraY += e.offsetY - lastMouseY;        lastMouseX = e.offsetX;        lastMouseY = e.offsetY;        draw();      } else {        const node = getNodeAtMouse(e.offsetX, e.offsetY);        if (node !== hoveredNode) {          hoveredNode = node;          if (node) showInfo(node);          else document.getElementById('info').style.display = 'none';        }      }    });    canvas.addEventListener('mouseup', () => isDragging = false);    canvas.addEventListener('mouseleave', () => isDragging = false);    // Zoom with wheel    canvas.addEventListener('wheel', e => {      e.preventDefault();      const delta = e.deltaY < 0 ? 1.1 : 0.9;      const oldZoom = zoom;      zoom *= delta;      zoom = Math.max(0.2, Math.min(zoom, 4));      // Zoom toward mouse      const mx = e.offsetX - canvas.width/2;      const my = e.offsetY - canvas.height/2;      cameraX = mx - (mx - cameraX) * (zoom / oldZoom);      cameraY = my - (my - cameraY) * (zoom / oldZoom);      draw();    });    function showInfo(node) {      const info = document.getElementById('info');      info.innerHTML = `        <strong>${node.name || 'Unnamed Node'}</strong><br>        <small>ID: ${node.id}</small><br><br>        ${node.stats ? node.stats.map(s => '• ' + s).join('<br>') : ''}      `;      info.style.display = 'block';    }    function resetView() {      cameraX = 0;      cameraY = 0;      zoom = 0.8;      draw();    }    function searchNodes() {      const term = document.getElementById('search').value.toLowerCase().trim();      if (!term) return;            const found = nodes.find(n => n.name && n.name.toLowerCase().includes(term));      if (found) {        cameraX = -found.x * 0.85 * zoom;        cameraY = -found.y * 0.85 * zoom;        draw();        showInfo(found);      } else {        alert("Node not found");      }    }    window.addEventListener('resize', () => {      resizeCanvas();      draw();    });    // Start    window.onload = loadData;  </script></body></html>
