<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>rendo</title>
  
  <meta property="og:title" content="rendo">
  <meta property="og:description" content="">
  
  <!-- Smart OG Image - works on all rendo.eu.org domains -->
  <meta property="og:image" content="/pictures/collage.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rendo.eu.org/">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    body, html { 
      height:100%; 
      margin:0; 
      overflow:hidden; 
      background:black; 
      font-family:'Courier New',monospace; 
    }
    canvas { display:block; }
    #text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #0f0;
      font-size: 120px;
      font-weight: bold;
      text-shadow: 0 0 20px #0f0;
      pointer-events: none;
      z-index: 10;
      letter-spacing: 12px;
    }
    .keypop {
      position: absolute;
      pointer-events: none;
      font-size: 80px;
      font-weight: bold;
      z-index: 8;
      text-shadow: 0 0 15px currentColor;
      opacity: 0;
      animation: pop 1.2s forwards;
    }
    @keyframes pop {
      0%   { opacity:0; transform:scale(0.5) translateY(0); }
      20%  { opacity:1; transform:scale(1.3) translateY(-20px); }
      100% { opacity:0; transform:scale(1) translateY(-120px); }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="text">RENDO</div>

  <audio id="thock" preload="auto">
    <source src="thock.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Matrix Rain Background
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    c.height = window.innerHeight;
    c.width = window.innerWidth;

    const matrix = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}".split("");
    const fontSize = 14;
    const cols = c.width / fontSize;
    const drops = Array(Math.floor(cols)).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.04)';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const txt = matrix[Math.floor(Math.random()*matrix.length)];
        ctx.fillText(txt, i*fontSize, drops[i]*fontSize);
        if (drops[i]*fontSize > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 35);

    // Resize canvas when window resizes
    window.addEventListener('resize', () => {
      c.height = window.innerHeight;
      c.width = window.innerWidth;
    });

    // === Smart Base URL Handler ===
    function getBaseUrl() {
        const hostname = window.location.hostname;
        if (hostname.includes('rendo.eu.org')) {
            return window.location.origin;
        }
        return 'https://ipfs.rendo.eu.org';
    }

    // Audio & Typing System
    const thock = document.getElementById('thock');
    let typed = '';

    document.addEventListener('keydown', e => {
      if (e.key.length !== 1) return;

      typed += e.key.toLowerCase();
      if (typed.length > 6) typed = typed.slice(-6);

      // Visual key pop effect
      const pop = document.createElement('div');
      pop.className = 'keypop';
      pop.textContent = e.key.toUpperCase();
      
      pop.style.color = (Math.random() > 0.5 ? '#00f' : '#f00');
      pop.style.left = Math.random() * 90 + 5 + '%';
      pop.style.top  = Math.random() * 70 + 10 + '%';
      
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 1300);

      // Play sound
      thock.currentTime = 0;
      thock.play().catch(()=>{});
	  
      // === Triggers ===
      if (typed === 'charts') {
        const base = getBaseUrl();
        window.location.href = `${base}/charts/?1=HIP3XYZ:SP500USDC.P&2=HIP3XYZ:XYZ100USDC.P&3=HYPERLIQUID:ETHUSDC.P&4=HYPERLIQUID:BTCUSDC.P&5=CAPITALCOM:DXY&6=HIP3XYZ:CLUSDC.P&7=HIP3XYZ:SILVERUSDC.P&8=HIP3XYZ:GOLDUSDC.P&9=CADUSD&10=HIP3XYZ:JPYUSDC.P&11=HIP3XYZ:GBPUSDC.P&12=HIP3XYZ:EURUSDC.P#nav`;
      }
      
      if (typed === 'girls') {
        const base = getBaseUrl();
        window.location.href = `${base}/girls`;
      }
    });
  </script>
</body>
</html>
