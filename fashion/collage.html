<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fa-fa-fa-fa-fashion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">Fa-fa-fa-fa-fashion</a>
    <nav class="nav">
      <a href="index.html">← All</a>
    </nav>
  </header>

  <div class="day-nav" id="dayNav" style="padding-top: 24px;"></div>

  <div class="grid" id="grid"></div>

  <!-- Footer with your X link -->
  <footer class="site-footer">
    <a href="https://x.com/rendo" target="_blank" rel="noopener" class="x-link">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      @rendo
    </a>
  </footer>

  <div class="modal" id="modal" onclick="if(event.target===this) closeModal();">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">×</span>
      <img id="modalImg" src="" alt="">
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </div>

  <script src="data/collages.js"></script>
  <script src="js/main.js"></script>
  <script>
    const id = getQueryParam('id') || '2026-08-14';
    const collage = getCollage(id);

    if (collage) {
      document.title = `${collage.date} • Fa-fa-fa-fa-fashion`;
      renderCollage(collage.posts);

      const sorted = [...collages]
        .filter(c => c.posts && c.posts.length > 0)
        .sort((a, b) => b.id.localeCompare(a.id));

      const currentIndex = sorted.findIndex(c => c.id === id);
      const nav = document.getElementById('dayNav');

      let navHTML = '';
      if (currentIndex < sorted.length - 1) {
        const prev = sorted[currentIndex + 1];
        navHTML += `<a href="collage.html?id=${prev.id}">← ${prev.date}</a>`;
      }
      if (currentIndex > 0) {
        const next = sorted[currentIndex - 1];
        navHTML += `<a href="collage.html?id=${next.id}">${next.date} →</a>`;
      }
      nav.innerHTML = navHTML;
    } else {
      document.getElementById('grid').innerHTML = `
        <div class="empty">
          Collage not found.<br>
          <a href="index.html" style="color:#fff;margin-top:12px;display:inline-block;">← Back</a>
        </div>`;
    }
  </script>
</body>
</html>
