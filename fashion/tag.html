<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fa-fa-fa-fa-fashion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">Fa-fa-fa-fa-fashion</a>
    <nav class="nav">
      <a href="index.html">← All</a>
    </nav>
  </header>

  <div class="page-title" style="padding-bottom: 4px;">
    <h1 id="pageTitle" style="font-size: 1.5rem;">Looks</h1>
    <h2 id="pageSubtitle"></h2>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search any name…" autocomplete="off">
  </div>

  <div class="grid" id="grid"></div>

  <footer class="site-footer">
    <a href="https://x.com/rendo" target="_blank" rel="noopener" class="x-link">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      @rendo
    </a>
  </footer>

  <div class="modal" id="modal" onclick="if(event.target===this) closeModal();">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">×</span>
      <img id="modalImg" src="" alt="">
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </div>

  <script src="data/collages.js"></script>
  <script src="js/main.js"></script>
  <script>
    const query = getQueryParam('q') || '';
    const titleEl = document.getElementById('pageTitle');
    const subEl = document.getElementById('pageSubtitle');
    const input = document.getElementById('searchInput');

    function updatePage(q) {
      if (!q) {
        titleEl.textContent = 'Search';
        subEl.textContent = '';
        document.getElementById('grid').innerHTML = '';
        return;
      }

      const results = getPostsByName(q);
      titleEl.textContent = q;
      subEl.textContent = `${results.length} look${results.length !== 1 ? 's' : ''}`;
      document.title = `${q} • Fa-fa-fa-fa-fashion`;
      renderTagResults(q);
    }

    if (query) {
      input.value = query;
      updatePage(query);
    }

    let timer;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const q = input.value.trim();
        const url = q ? `tag.html?q=${encodeURIComponent(q)}` : 'tag.html';
        history.replaceState(null, '', url);
        updatePage(q);
      }, 250);
    });
  </script>
</body>
</html>
